spring.application.name=crypto-portfolio-tracker
server.port=8080

#mysql properties or configurations
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#it will display the queries running in the console
spring.jpa.show-sql=true
#for automatically updating database after every change
spring.jpa.hibernate.ddl-auto=update
# Format SQL nicely
spring.jpa.properties.hibernate.format_sql=true

# Show SQL parameters (optional)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#it helps in converting/mapping java data types to database data types
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sravan3251@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=5000

# JWT Secret
jwt.secret=mysupersecretkey123456789012345678901234567890
jwt.expiration=604800000

crypto.secretkey=mySuperSecretKey


# CoinGecko API URLs
coingecko.api.ping=https://api.coingecko.com/api/v3/ping
coingecko.api.markets=https://api.coingecko.com/api/v3/coins/markets
coingecko.api.market-chart=https://api.coingecko.com/api/v3/coins/{coinId}/market_chart
coingecko.api.exchanges=https://api.coingecko.com/api/v3/exchanges


#Binance connect API
Binance.api.base-url=https://testnet.binance.vision/api/v3
binance.api.account-endpoint=/account

binance.endpoint.open-orders=/openOrders
binance.endpoint.exchange-info=/exchangeInfo
binance.endpoint.server-time=/time